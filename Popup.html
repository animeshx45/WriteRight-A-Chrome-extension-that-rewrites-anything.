<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WriteRight Settings</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #12100d;
      color: #f4efe4;
      width: 300px;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 span {
      width: 20px; height: 20px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffe27a 0%, #f0b429 55%, #a06800 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #1a1100;
    }

    label {
      font-size: 12px;
      color: #9c9683;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: block;
    }

    select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #1c1812;
      color: #e7e0cf;
      font-size: 13px;
      margin-bottom: 14px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    select:focus {
      outline: none;
      border-color: rgba(240,180,41,0.75);
      background: #241e15;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: filter 0.2s ease, background 0.2s ease;
    }

    button#save {
      background: linear-gradient(180deg, #f3c34a 0%, #d69a12 100%);
      color: #1a1100;
      box-shadow: 0 4px 12px rgba(240,180,41,0.35);
    }

    button#save:hover { filter: brightness(1.06); }

    button#test {
      background: transparent;
      color: #b8b1a0;
      border-color: rgba(255,255,255,0.1);
    }

    button#test:hover { background: rgba(255,255,255,0.05); color: #fff; }

    .msg {
      margin-top: 12px;
      font-size: 12px;
      min-height: 16px;
      color: #9c9683;
    }
    .msg.ok { color: #ffe27a; }
    .msg.err { color: #ff8a7a; }
  </style>
</head>
<body>
<h1><span>✦</span> WriteRight Settings</h1>

<label for="mode">Default Mode</label>
<select id="mode">
  <option value="professional">Professional</option>
  <option value="casual">Casual</option>
  <option value="formal">Formal</option>
  <option value="friendly">Friendly</option>
  <option value="persuasive">Persuasive</option>
  <option value="cold_email">Cold Email</option>
  <option value="follow_up">Follow-up</option>
  <option value="concise">Concise</option>
</select>

<div class="actions">
  <button id="save">Save</button>
  <button id="test">Test AI Connection</button>
</div>

<div id="msg" class="msg"></div>

<script src="popup.js"></script>
</body>
</html>
